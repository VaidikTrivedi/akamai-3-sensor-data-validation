<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sensor Data Generator Test</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }

        button {
            margin: 10px 0;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .output {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
            background: #f9f9f9;
            white-space: pre-wrap;
            font-family: monospace;
            overflow-x: auto;
        }

        .output p {
            margin: 5px 0;
        }

        .output .json {
            background: #f4f4f4;
            padding: 5px;
            border-radius: 3px;
        }

        #chartContainer {
            display: none;
            margin: 20px 0;
            padding: 20px;
            border: 2px solid #007BFF;
            border-radius: 8px;
            background-color: #f8f9fa;
        }

        #chartContainer h2 {
            margin-top: 0;
            color: #007BFF;
        }

        canvas {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="akamai-sensor-data.js"></script>
    </head>

    <body>

        <form id="loginForm" style="margin-bottom: 20px;">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username"
                autocomplete="username" required>
            <br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                autocomplete="current-password" required>
            <br><br>
            <button id="login" type="button">Login</button>
        </form>

        <h1>Sensor Data Generator Test</h1>
        <button id="runTest" onclick="runAllTests()">Run All Tests</button>
        <div id="output" class="output">Output will appear here</div>

        <div id="chartContainer" style="display: none; margin-top: 20px;">
            <h2>Mouse Data Visualization</h2>
            <div style="position: relative; height: 500px; width: 100%;">
                <canvas id="mouseDataChart"></canvas>
            </div>
        </div>
    </body>

</html>
